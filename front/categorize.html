<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker - Categorize</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="nav">
        <ul class="nav-list">
            <li><a href="index.html" class="nav-link">Home</a></li>
            <li><a href="upload.html" class="nav-link">Upload</a></li>
            <li><a href="categorize.html" class="nav-link active">Categorize</a></li>
            <li><a href="stats.html" class="nav-link">Statistics</a></li>
        </ul>
    </nav>

    <main class="transactions-container">
        <header class="page-header">
            <h1>Categorize Transactions <span class="transaction-count"></span></h1>
            <button class="submit-button">Submit</button>
        </header>
        
        <table class="transactions-grid">
            <thead>
                <tr>
                    <th>Category</th>
                    <th>Date</th>
                    <th>Title</th>
                    <th>Amount</th>
                    <th>Actions</th>
                    <th>Exclude</th>
                </tr>
            </thead>
            <tbody>
                <!-- Transactions will be inserted here -->
            </tbody>
        </table>
    </main>

    <dialog class="details-dialog">
        <div class="dialog-header">
            <div class="dialog-navigation">
                <button class="nav-button prev-button" disabled>Previous</button>
                <button class="nav-button next-button" disabled>Next</button>
            </div>
            <form method="dialog">
                <button class="dialog-close" value="close">×</button>
            </form>
        </div>
        <div class="dialog-content"></div>
    </dialog>

    <script type="module" src="js/categorize.js"></script>
</body>
</html>
