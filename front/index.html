<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="nav">
        <ul class="nav-list">
            <li><a href="#" class="nav-link upload-link">Upload</a></li>
            <li><a href="#" class="nav-link categorize-link">Categorize</a></li>
        </ul>
    </nav>

    <div class="upload-container">
        <h1>Upload Transactions</h1>
        
        <div class="file-input-group">
            <label class="form-label">Select Spreadsheet File</label>
            <input type="file" class="file-input" accept=".xlsx,.xls,.csv">
        </div>

        <div class="sheet-type-group">
            <label class="form-label">Select Statement Type</label>
            <select class="sheet-type-select">
                <option value="">Choose a statement type...</option>
                <option value="masterStatement">Master Statement</option>
                <option value="hapoalimStatement">Bank Hapoalim Statement</option>
                <option value="mcStatement">Master Card Statement</option>
            </select>
        </div>

        <button class="process-button" disabled>Process Spreadsheet</button>
        <button class="get-all-transactions">Show All Transactions</button>
        <div class="status-message"></div>
    </div>

    <div class="transactions-container" style="display: none">
        <header class="page-header">
            <h1>Categorize Transactions</h1>
            <button class="submit-button">Submit</button>
        </header>
        <table class="transactions-grid">
            <thead>
                <tr>
                    <th>Category</th>
                    <th>Date</th>
                    <th>Title</th>
                    <th>Amount</th>
                    <th>Actions</th>
                    <th>Exclude</th>
                </tr>
            </thead>
            <tbody>
                <!-- Transactions will be inserted here -->
            </tbody>
        </table>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
