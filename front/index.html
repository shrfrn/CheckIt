<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .upload-container {
            max-width: 600px;
            margin: 2rem auto;
            padding: 2rem;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .file-input-group, .sheet-type-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }

        .file-input, .sheet-type-select {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .process-button {
            background-color: #4CAF50;
            color: white;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .process-button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        .status-message {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 4px;
            display: none;
        }

        .status-message.success { background-color: #dff0d8; color: #3c763d; display: block; }
        .status-message.error { background-color: #f2dede; color: #a94442; display: block; }
    </style>
</head>
<body>
    <nav class="nav">
        <ul class="nav-list">
            <li><a href="#" class="nav-link upload-link">Upload</a></li>
            <li><a href="#" class="nav-link categorize-link">Categorize</a></li>
        </ul>
    </nav>

    <div class="upload-container">
        <h1>Upload Transactions</h1>
        
        <div class="file-input-group">
            <label class="form-label">Select Spreadsheet File</label>
            <input type="file" class="file-input" accept=".xlsx,.xls,.csv">
        </div>

        <div class="sheet-type-group">
            <label class="form-label">Select Statement Type</label>
            <select class="sheet-type-select">
                <option value="">Choose a statement type...</option>
                <option value="masterStatement">Master Statement</option>
                <option value="hapoalimStatement">Bank Hapoalim Statement</option>
                <option value="mcStatement">Master Card Statement</option>
            </select>
        </div>

        <button class="process-button" disabled>Process Spreadsheet</button>
        <button class="get-all-transactions">Show All Transactions</button>
        <div class="status-message"></div>
    </div>

    <div class="transactions-container" style="display: none">
        <h1>Categorize Transactions</h1>
        <table class="transactions-grid">
            <thead>
                <tr>
                    <th>Category</th>
                    <th>Date</th>
                    <th>Title</th>
                    <th>Amount</th>
                    <th>Actions</th>
                    <th>Exclude</th>
                </tr>
            </thead>
            <tbody>
                <!-- Transactions will be inserted here -->
            </tbody>
        </table>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
